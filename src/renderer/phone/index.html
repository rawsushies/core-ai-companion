<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <title>COre</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="head">
    <img class="mark" src="/icon.png" alt="" width="34" height="34">
    <div class="id">
      <div class="name">COre</div>
      <div id="status" class="status">Connecting…</div>
    </div>
    <button type="button" id="stop" class="ghost" hidden>Stop</button>
  </header>

  <section id="pair" class="pair" hidden>
    <h1>Pair with COre</h1>
    <p id="pair-text">Connecting to COre on your PC…</p>
    <div id="code" class="code" hidden></div>
    <p class="fine">Check that COre on your PC shows the same code, then click Allow there.</p>
  </section>

  <section id="unpaired" class="pair" hidden>
    <h1>Not paired</h1>
    <p>On your PC open COre Settings, Phone, and choose <b>Pair a phone</b>. Then scan the QR code with this phone.</p>
  </section>

  <main id="log" class="log" aria-live="polite" hidden></main>

  <div id="media" class="media" hidden>
    <button type="button" data-media="previous" aria-label="Previous track"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 5v14M18 6l-9 6 9 6V6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
    <button type="button" data-media="toggle" aria-label="Play or pause"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 5l10 7-10 7V5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
    <button type="button" data-media="next" aria-label="Next track"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M18 5v14M6 6l9 6-9 6V6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
    <button type="button" data-media="quieter" aria-label="Volume down">−</button>
    <button type="button" data-media="louder" aria-label="Volume up">+</button>
  </div>

  <form id="composer" class="composer" hidden>
    <div class="field"><textarea id="input" rows="1" placeholder="Message COre…" aria-label="Message"></textarea></div>
    <button type="submit" class="send" aria-label="Send">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 12l16-8-6 16-2.5-6.5L4 12Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
  </form>

  <script src="/nacl.js"></script>
  <script src="/app.js"></script>
</body>
</html>
