name: CI

# Every branch and pull request: syntax check and tests are blocking on Linux
# and Windows, and the packaged Windows app + installer must pass a self-test.
# Nothing is published from here.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip # GPU (CUDA) binaries from nuget.org are not needed; the CPU ones ship in the package
      - run: npm run check
      - name: Cortex knowledge vault for the memory gateway tests
        shell: bash
        run: git clone --depth 1 https://github.com/rawsushies/cortex-ai-brain "$RUNNER_TEMP/cortex" && echo "CORTEX_DIR=$RUNNER_TEMP/cortex" >> "$GITHUB_ENV"
      - name: Sandbox backend for the agent's commands, Syncthing for the vault acceptance (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap syncthing >/dev/null && (bwrap --ro-bind / / --unshare-all true && echo bwrap works || echo "bwrap blocked here; sandbox tests will skip")
      - run: npm test
      - name: Self-test the app (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xdotool >/dev/null
          mkdir -p "$RUNNER_TEMP/ud" && echo '{"orb":{"graphics":"software"}}' > "$RUNNER_TEMP/ud/config.json"
          xvfb-run -a npx electron --no-sandbox . --smoke-test="$RUNNER_TEMP/smoke.json" --user-data-dir="$RUNNER_TEMP/ud"
          cat "$RUNNER_TEMP/smoke.json"
      - name: End-to-end tests against the real app (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x900x24" npm run e2e

  package-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip # GPU (CUDA) binaries from nuget.org are not needed; the CPU ones ship in the package
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ci/bundle-requirements.txt
      - name: Bundle Cortex.exe and the local AI models
        shell: bash
        run: bash scripts/ci/bundle.sh
      - name: Build installer (not published)
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $ud = Join-Path $env:RUNNER_TEMP 'ud'; New-Item -ItemType Directory -Force $ud | Out-Null
          '{"orb":{"graphics":"software"}}' | Set-Content -Encoding utf8 (Join-Path $ud 'config.json')
          $r = Join-Path $env:RUNNER_TEMP 'packaged-smoke.json'
          $p = Start-Process -FilePath 'dist\win-unpacked\COre.exe' -ArgumentList "--smoke-test=$r", "--user-data-dir=$ud" -PassThru -Wait
          Get-Content $r
          if ($p.ExitCode -ne 0) { throw "packaged smoke test failed" }
      - name: Installer install / self-test / uninstall
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\COre-Setup-*.exe | Select-Object -First 1
          ./scripts/ci/installer-smoke.ps1 -Installer $exe.FullName
      - name: Check update metadata
        shell: pwsh
        run: if (-not (Test-Path dist\latest.yml)) { throw 'latest.yml missing' }; Get-Content dist\latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: core-installer-${{ github.sha }}
          path: |
            dist/COre-Setup-*.exe
            dist/COre-Setup-*.exe.blockmap
            dist/latest.yml
          retention-days: 7

  # The installed product, end to end: the installer CI just built, installed silently, first
  # launch -> bundled Cortex -> vault -> real Obsidian -> recall, and a second installation
  # joined by real Syncthing (test-e2e/installed.e2e.js).
  installed-windows:
    needs: package-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - uses: actions/download-artifact@v4
        with:
          name: core-installer-${{ github.sha }}
          path: installer
      - name: Install Obsidian and Syncthing
        run: choco install obsidian syncthing -y --no-progress
      - name: Install COre silently, plus a second installation (another device)
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer\COre-Setup-*.exe | Select-Object -First 1
          $a = Join-Path $env:RUNNER_TEMP 'core-A'; $b = Join-Path $env:RUNNER_TEMP 'core-B'
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '/S', "/D=$a" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          Copy-Item -Recurse $a $b
          "CORE_EXE_A=$a\COre.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CORE_EXE_B=$b\COre.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Installed-app acceptance
        run: node --test test-e2e/installed.e2e.js
        env:
          INSTALLED_EVIDENCE: ${{ runner.temp }}/installed-evidence.txt
      - name: Evidence
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/installed-evidence.txt" 2>/dev/null || echo "no evidence file"

  # Office-suite scenarios on real Windows. Microsoft Office cannot be installed
  # on CI without a license, so this uses LibreOffice (Calc), a real office app.
  office-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: Install LibreOffice
        run: choco install libreoffice-fresh -y --no-progress
      - run: node --test test/office.win.test.js
        env:
          CORE_OFFICE: '1'
          CORE_SHOTS: ${{ runner.temp }}
      - name: Install Obsidian
        if: always()
        run: choco install obsidian -y --no-progress
      - name: Real Obsidian opens the vault COre set up
        if: always()
        run: node --test test/obsidian.win.test.js
        env:
          CORE_OBSIDIAN: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/*.png
          retention-days: 7
          if-no-files-found: ignore
