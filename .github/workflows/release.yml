name: Release

# Releases happen ONLY when a maintainer pushes a version tag (vX.Y.Z) or runs
# this workflow by hand for an existing tag. A package.json change alone never
# publishes anything. All gates must pass, and the result is a DRAFT release:
# a human reviews it and clicks "Publish" (installed copies only see published
# releases). See docs/dev/RELEASING.md.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v10.4.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # create the draft release
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag must match package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$TAG" ] || { echo "tag $TAG does not match package.json version $v"; exit 1; }
      - name: Refuse to overwrite an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists"; exit 1; fi
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          # Optional code signing (repository secrets). Without them the build is unsigned.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $ud = Join-Path $env:RUNNER_TEMP 'ud'; New-Item -ItemType Directory -Force $ud | Out-Null
          '{"orb":{"graphics":"software"}}' | Set-Content -Encoding utf8 (Join-Path $ud 'config.json')
          $r = Join-Path $env:RUNNER_TEMP 'packaged-smoke.json'
          $p = Start-Process -FilePath 'dist\win-unpacked\COre.exe' -ArgumentList "--smoke-test=$r", "--user-data-dir=$ud" -PassThru -Wait
          Get-Content $r
          if ($p.ExitCode -ne 0) { throw "packaged smoke test failed" }
      - name: Installer install / self-test / uninstall
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\COre-Setup-*.exe | Select-Object -First 1
          ./scripts/ci/installer-smoke.ps1 -Installer $exe.FullName
      - name: Checksums and update metadata
        shell: bash
        run: |
          cd dist
          test -f latest.yml || { echo "latest.yml missing"; exit 1; }
          sha256sum COre-Setup-*.exe COre-Setup-*.exe.blockmap latest.yml > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create DRAFT release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "COre ${TAG#v}" --notes-file RELEASE_NOTES.md \
            dist/COre-Setup-*.exe dist/COre-Setup-*.exe.blockmap dist/latest.yml dist/SHA256SUMS.txt

  # The Android app, attached to the same draft release (debug-signed APK).
  android:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm run android:add
      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${TAG#v}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "COre-android-$v.apk"
          sha256sum "COre-android-$v.apk" > "COre-android-$v.apk.sha256"
          gh release upload "$TAG" "COre-android-$v.apk" "COre-android-$v.apk.sha256" --repo "$GITHUB_REPOSITORY"
